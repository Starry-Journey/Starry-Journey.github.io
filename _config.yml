# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Starry Journey
subtitle: ''
description: ''
keywords:
author: Starry Journey
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://starry-journey.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: stellar

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# 星空主题注入
inject:
  head:
    - '<script>try{if(!localStorage.getItem("Stellar.theme"))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>'
    - '<link rel="stylesheet" href="/css/starfield.css">'
    - '<script src="/js/starfield.js" defer></script>'
    - '<link rel="stylesheet" href="/css/comments.css">'
    - '<script>window.BLOG_COMMENTS_API="https://starryjourney.duckdns.org:8443"</script>'
    - '<script src="/js/comments.js" defer></script>'
    - '<link rel="stylesheet" href="/css/chatbot.css">'
    - '<script>window.BLOG_CHAT_API="https://starryjourney.duckdns.org:8443/bot/api/chat"</script>'
    - '<script src="/js/chatbot.js" defer></script>'
