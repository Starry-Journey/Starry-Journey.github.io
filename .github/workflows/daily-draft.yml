name: Daily Draft PR

on:
  push:
    branches:
      - 'daily-*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.NEWS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="feat: 每日随笔 ${BRANCH#daily-}"
          BODY="AI 生成的每日随笔草稿，封面为自动生成的星空 SVG。请审核内容后合并。"
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
