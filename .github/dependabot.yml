version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      hexo:
        patterns:
          - 'hexo*'
      lint-test:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - '@playwright/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
