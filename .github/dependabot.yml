version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: 'hexo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'hexo-theme-stellar'
        update-types: ['version-update:semver-major']
      - dependency-name: 'hexo-theme-next'
        update-types: ['version-update:semver-major']
    groups:
      hexo:
        patterns:
          - 'hexo*'
      lint-test:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - '@playwright/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
